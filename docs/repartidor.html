<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>El Horno · Reparto</title><meta name="theme-color" content="#143f35"><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head><body>
<main class="courier"><header class="courier-header"><a href="index.html" class="courier-logo">el horno<span>REPARTO</span></a><button id="profile" class="courier-avatar" aria-label="Abrir perfil">Cuenta</button></header><p id="courier-connection" class="courier-connection" role="status" aria-live="polite" hidden></p><section id="courier-view"></section><nav class="courier-nav" aria-label="Navegación del repartidor"><button data-screen="home"><span aria-hidden="true"><img src="assets/icons/home.svg" alt=""></span>Inicio</button><button data-screen="earnings"><span aria-hidden="true"><img src="assets/icons/wallet.svg" alt=""></span>Ganancias</button><button data-screen="history"><span aria-hidden="true"><img src="assets/icons/history.svg" alt=""></span>Actividad</button><button data-screen="profile"><span aria-hidden="true"><img src="assets/icons/user.svg" alt=""></span>Cuenta</button></nav></main>
<dialog id="delivery-confirm"><h2>¿Todo entregado?</h2><p>Confirma que el cliente recibió el pedido y que el pago fue cobrado.</p><label class="confirm-check"><input id="payment-confirm" type="checkbox"> Confirmo la entrega y el cobro.</label><div class="row"><button class="btn ghost" id="back-delivery">Volver</button><button class="btn" id="finish-delivery" disabled>Confirmar entrega</button></div></dialog>
<script src="store.js"></script><script>
DB.ready.then(()=>{
 document.body.dataset.page='repartidor';document.body.classList.add('courier-body');
 const ME='Repartidor 1',map=a=>'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(a);
 let on=sessionStorage.getItem('driver-online')!=='false',screen='home',busy=false,pendingDelivery=null;
 const deliveries=()=>DB.get().orders.filter(o=>o.type==='delivery'),completed=()=>deliveries().filter(o=>o.driver===ME&&o.status==='done'&&!o.demo),today=o=>new Date(o.completedAt||o.at).toDateString()===new Date().toDateString(),income=os=>os.reduce((a,o)=>a+(o.driverPay??DB.get().site.driverPay),0);
 const route=(o,active=false)=>`<div class="route-stops"><div><span class="stop-dot"></span><div><small>RECOGER EN EL HORNO</small><b>${esc(DB.get().site.addr)}</b></div></div><div><span class="stop-dot destination"></span><div><small>ENTREGAR ${active?'A '+esc(o.name).toUpperCase():'AL CLIENTE'}</small><b>${esc(o.addr)}</b></div></div></div>`;
 const payment=o=>o.pay==='cash'?`Cobrar ${$m(o.total)} en efectivo`:'Pago simulado: confirmar cobro al entregar';
 function offer(o){return `<article class="delivery-offer"><div class="offer-heading"><span class="courier-pill">Pedido disponible</span><small>${esc(o.id)}${o.demo?' · Ejemplo':''}</small></div><h2>${$m(DB.get().site.driverPay)}<small>por esta entrega</small></h2>${route(o)}<div class="offer-meta"><span>${o.items.reduce((a,x)=>a+x.q,0)} piezas</span><b>${payment(o)}</b></div><button class="courier-primary" data-accept="${o.id}" ${busy?'disabled':''}>Aceptar entrega <span>→</span></button></article>`}
 function active(o){return `<div class="courier-section-title"><div><small>ENTREGA EN CURSO</small><h1>${o.picked?'Vamos al cliente.':'Tu próxima parada.'}</h1></div><span class="courier-pill">${esc(o.id)}</span></div><article class="delivery-offer active-delivery"><div class="delivery-progress"><span class="done">1 · Aceptado</span><span class="${o.picked?'done':'current'}">2 · Recogida</span><span class="${o.picked?'current':''}">3 · Entrega</span></div>${route(o,true)}<a class="courier-primary" href="${map(o.picked?o.addr:DB.get().site.addr)}" target="_blank" rel="noopener">Abrir ruta en Maps <span>↗</span></a><div class="order-contents"><small>CONTENIDO DEL PEDIDO</small>${o.items.map(x=>`<p><b>${x.q} ×</b> ${esc(x.n)}</p>`).join('')}${o.note?`<div class="delivery-note">${esc(o.note)}</div>`:''}</div><div class="collect-amount"><small>${o.pay==='cash'?'EFECTIVO POR COBRAR':'CONFIRMAR EL PAGO'}</small><b>${$m(o.total)}</b><span>${payment(o)}</span></div><a class="courier-secondary" href="tel:${esc(o.phone)}">Llamar a ${esc(o.name)}</a><button class="courier-primary" data-${o.picked?'deliver':'pickup'}="${o.id}" ${busy?'disabled':''}>${o.picked?'Confirmar entrega':'Ya recogí el pedido'} <span>✓</span></button></article>`}
 function home(){const d=DB.get(),os=deliveries(),mine=os.find(o=>o.driver===ME&&o.status==='route'),offers=os.filter(o=>o.status==='ready'&&!o.driver),soon=os.filter(o=>['new','prep'].includes(o.status)),done=completed().filter(today);
 return `<section class="courier-greeting"><div><small>EL HORNO · REPARTIDOR 1</small><h1>Tu día, en movimiento.</h1></div><button class="availability ${on?'available':''}" id="availability" aria-pressed="${on}"><i></i>${on?'Disponible':'En pausa'}</button></section><div class="courier-summary"><button data-screen="earnings"><small>Ganancias de hoy <span>↗</span></small><strong>${$m(income(done))}</strong></button><div><small>Entregas</small><strong>${done.length.toString().padStart(2,'0')}</strong></div></div>${mine?active(mine):`<div class="availability-panel ${on?'':'paused'}"><div class="availability-symbol" aria-hidden="true">${on?'↗':'Ⅱ'}</div><div><h2>${on?'Listo para salir.':'Tómate una pausa.'}</h2><p>${on?'Te mostramos los pedidos cuando están listos en tienda.':'Conéctate cuando estés listo para recibir entregas.'}</p></div><span class="courier-pill">${on?offers.length+(offers.length===1?' disponible':' disponibles'):'Sin ofertas'}</span></div><div class="courier-section-title"><h2>${on?'Ofertas para ti':'Estás desconectado'}</h2><small>${on?'Retiro en sucursal':'Tu actividad se conserva'}</small></div>${on?(offers.map(offer).join('')||'<div class="courier-empty"><b>Por ahora, todo entregado.</b><p>Las nuevas ofertas aparecerán aquí automáticamente.</p></div>'):'<button class="courier-primary" id="connect">Conectarme →</button>'}${on&&soon.length?`<div class="upcoming"><h3>En el horno</h3><p>${soon.length} pedido${soon.length===1?'':'s'} en preparación. Aún no se puede${soon.length===1?'':'n'} recoger.</p></div>`:''}`}`}
 function earnings(){const os=completed(),td=os.filter(today);return `<div class="courier-section-title"><div><small>TU TRABAJO CUENTA</small><h1>Ganancias</h1></div></div><div class="earnings-hero"><small>ACUMULADO HOY</small><strong>${$m(income(td))}</strong><span>${td.length} entrega${td.length===1?'':'s'} completada${td.length===1?'':'s'}</span></div><div class="courier-summary"><div><small>Total acumulado</small><strong>${$m(income(os))}</strong></div><div><small>Por entrega actual</small><strong>${$m(DB.get().site.driverPay)}</strong></div></div><p class="courier-disclaimer">Importes registrados por entrega. No representan una transferencia bancaria. Los pedidos de ejemplo están excluidos.</p>${historyRows(td)}`}
 function historyRows(os){return os.length?os.map(o=>`<article class="history-row"><span class="history-check">✓</span><div><b>${esc(o.id)}</b><small>${new Date(o.completedAt||o.at).toLocaleString('es-MX')}<br>${esc(o.addr)}</small></div><strong>+${$m(o.driverPay??DB.get().site.driverPay)}</strong></article>`).join(''):'<div class="courier-empty"><b>Aquí empieza tu recorrido.</b><p>Las entregas completadas aparecerán en tu actividad.</p></div>'}
 function profile(){return `<div class="courier-section-title"><div><small>TU ESPACIO</small><h1>Mi cuenta</h1></div></div><article class="delivery-offer profile-card"><span class="courier-profile-label">TU CUENTA DE REPARTO</span><h2>Repartidor 1</h2><p>El Horno · Sucursal principal</p><div class="profile-detail"><small>Punto de recogida</small><b>${esc(DB.get().site.addr)}</b></div><div class="profile-detail"><small>Contacto de la tienda</small><a href="tel:${esc(DB.get().site.phone)}">${esc(DB.get().site.phone)}</a></div><a class="courier-secondary" href="${map(DB.get().site.addr)}" target="_blank" rel="noopener">Cómo llegar a la sucursal ↗</a><a class="courier-secondary" href="index.html">Ir a la tienda</a><button class="courier-secondary" id="logout-driver">Cerrar sesión</button></article>`}
 function R(){const root=$('#courier-view'),scroll=root.scrollTop;root.innerHTML=screen==='home'?home():screen==='earnings'?earnings():screen==='history'?'<div class="courier-section-title"><div><small>CADA ENTREGA, UN PASO MÁS</small><h1>Tu actividad</h1></div></div>'+historyRows(completed()):profile();root.scrollTop=scroll;$$('.courier-nav button').forEach(b=>{b.classList.toggle('selected',b.dataset.screen===screen);b.setAttribute('aria-current',b.dataset.screen===screen?'page':'false')});$$('.courier-primary[data-accept],.courier-primary[data-pickup],.courier-primary[data-deliver]').forEach(b=>b.disabled=busy||document.body.classList.contains('offline'))}
 async function up(action,id,extra={}){if(busy)return;if(document.body.classList.contains('offline'))return toast('Espera a reconectar para confirmar esta operación.');busy=true;R();try{await DB.action(action,{id,...extra});toast(action==='deliver'?'Entrega completada. ¡Buen trabajo!':action==='accept'?'Entrega aceptada. Ve a la sucursal.':'Pedido recogido. Sigue hacia el cliente.')}catch(e){toast(e.message)}finally{busy=false;R()}}
 document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const D=b.dataset;if(D.screen){screen=D.screen;R();return}if(b.id==='availability'||b.id==='connect'){on=b.id==='connect'||!on;sessionStorage.setItem('driver-online',String(on));R()}if(D.accept&&on)up('accept',D.accept);if(D.pickup)up('pickup',D.pickup);if(D.deliver){pendingDelivery=D.deliver;$('#payment-confirm').checked=false;$('#finish-delivery').disabled=true;$('#delivery-confirm').showModal()}if(b.id==='logout-driver'){await request('logout',{});location.reload()}});
 $('#payment-confirm').onchange=()=>connectionUI();$('#back-delivery').onclick=()=>$('#delivery-confirm').close();$('#finish-delivery').onclick=()=>{if(!$('#payment-confirm').checked||!pendingDelivery||document.body.classList.contains('offline'))return;$('#delivery-confirm').close();up('deliver',pendingDelivery,{confirmPayment:true});pendingDelivery=null};$('#profile').onclick=()=>{screen='profile';R()};function connectionUI(){const offline=document.body.classList.contains('offline'),banner=$('#courier-connection');banner.hidden=!offline;banner.textContent='Sin conexión. Datos de '+(DB.lastSync()?new Date(DB.lastSync()).toLocaleTimeString('es-MX',{hour:'2-digit',minute:'2-digit',hour12:false}):'la última consulta')+'. Espera a reconectar para aceptar o confirmar entregas.';$$('.courier-primary[data-accept],.courier-primary[data-pickup],.courier-primary[data-deliver]').forEach(b=>b.disabled=busy||offline);$('#finish-delivery').disabled=busy||offline||!$('#payment-confirm').checked}window.addEventListener('horno:connection',connectionUI);DB.on(R);R();connectionUI();
});
</script></body></html>
