<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Horno · Administración</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"><link rel="stylesheet" href="assets/admin/inventario.css"></head><body>
<main class="wrap"><div class="work-heading"><div><h1>Administración</h1></div><a class="btn ghost" href="index.html">Ver tienda ↗</a></div><div id="metrics" class="metrics"></div><div id="tabs" class="chips"></div><div id="v"></div></main>
<script src="assets/admin/inventario.js"></script><script src="store.js"></script><script>
DB.ready.then(()=>{
hub('admin');let tab=location.hash==='#inventario'?'inv':'ven',fl='act';
const act=o=>!['done','cancel'].includes(o.status);
const SF=[['hero','Título principal'],['sub','Subtítulo'],['promo','Anuncio superior'],['addr','Dirección'],['phone','Teléfono'],['wa','WhatsApp (10 dígitos)'],['ig','Instagram'],['open','Abre (hora)','number'],['close','Cierra (hora)','number'],['fee','Costo de envío','number'],['freeFrom','Envío gratis desde','number'],['driverPay','Pago al repartidor','number']];
function btns(o){if(!act(o)||o.status==='route')return'';const n={new:'Preparar',prep:'Marcar listo',ready:o.type==='pickup'?'Entregado':null}[o.status];
 return(n?`<button class="btn sm" data-ad="${o.id}">${n}</button> `:'')+(o.status==='ready'&&o.type==='delivery'?`<button class="btn ghost sm" data-as="${o.id}">Asignar repartidor</button> `:'')+`<button class="btn ghost sm danger" data-cx="${o.id}">Cancelar</button>`}
function ped(d){const os=d.orders.filter(o=>fl==='all'||act(o));
 return`<div class="chips"><button class="chip ${fl==='act'?'on':''}" data-fl="act">Activos</button><button class="chip ${fl==='all'?'on':''}" data-fl="all">Todos</button></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))">`+(os.map(o=>`<article class="card"><div class="pad"><div class="row"><b>${o.id}${o.demo?' <small>Ejemplo</small>':''}</b><span class="tag ${o.status}">${ST[o.status]}</span></div><p>${o.type==='delivery'?'🛵 Domicilio':o.type==='pos'?'🧾 Mostrador':'🛍 Recoger'} · ${esc(o.name)} · ${esc(o.slot)}${o.addr?`<br><small>${esc(o.addr)}</small>`:''}${o.driver?`<br><small>Repartidor: ${esc(o.driver)}</small>`:''}</p><p><small>${o.items.map(x=>x.q+'× '+esc(x.n)).join(' · ')}</small></p><div class="row"><b>${$m(o.total)}</b><span>${btns(o)}</span></div></div></article>`).join('')||'<p class="muted">Sin pedidos.</p>')+'</div>'}
function catalogo(d){return`<div class="tw"><table><thead><tr><th>Producto</th><th>Categoría</th><th>Precio</th><th>Existencia</th></tr></thead><tbody>${d.products.map(p=>`<tr><td><div class="inventory-product">${photo(p)}<b>${esc(p.n)}</b></div></td><td>${esc(p.c)}</td><td><input type="number" min="0.01" step="0.01" value="${p.p}" data-pp="${p.id}" aria-label="Precio de ${esc(p.n)}"></td><td><span class="qty"><button class="btn ghost sm" data-st="${p.id}" data-d="-1" aria-label="Restar">−</button><b class="${p.s<10?'low':''}">${p.s}${p.s<10?' ⚠':''}</b><button class="btn ghost sm" data-st="${p.id}" data-d="1" aria-label="Sumar">+</button><button class="btn ghost sm" data-st="${p.id}" data-d="12">+12 horneada</button></span></td></tr>`).join('')}</tbody></table></div>
<details class="inv-add"><summary>Agregar producto</summary><form id="npf" class="stack"><label>Nombre<input name="n" required></label><label>Categoría<select name="c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>Precio<input name="p" type="number" min="0.01" step="0.01" required></label><label>Existencia inicial<input name="s" type="number" min="0" value="0"></label><label>Emoji<input name="e" value="🍞"></label><label>Descripción<input name="d"></label><label>Ingredientes<input name="i"></label><label>Alérgenos<input name="a"></label><label>Peso/tamaño<input name="w"></label><label>Anticipación (horas)<input name="l" type="number" min="0" value="0"></label><button class="btn">Agregar producto</button></form></details>`}
const sit=d=>`<p class="muted">Edita la web pública. Se guarda al salir de cada campo y se refleja en la landing.</p><form id="sf" class="stack">${SF.map(([k,l,t])=>`<label>${l}<input name="${k}" type="${t||'text'}" value="${esc(d.site[k])}"></label>`).join('')}</form>`;
function ven(d){const os=d.orders.filter(o=>o.status==='done'&&!o.demo),sum=a=>a.reduce((s,o)=>s+o.total,0),top={};
 os.forEach(o=>o.items.forEach(x=>top[x.n]=(top[x.n]||0)+x.q));
 const days=Array.from({length:7},(_,i)=>{const dt=new Date();dt.setDate(dt.getDate()-6+i);const n=sum(os.filter(o=>new Date(o.completedAt||o.at).toDateString()===dt.toDateString()));return {label:dt.toLocaleDateString('es-MX',{weekday:'short'}),n}}),max=Math.max(1,...days.map(x=>x.n));
 return `<div class="report-heading"><div><span class="kick">EL PULSO DE TU PANADERÍA</span><h3>Resumen de ventas</h3><p class="muted">Ventas completadas · Excluye ejemplos y cancelaciones.</p></div><button class="btn ghost" id="export-sales">Descargar CSV ↓</button></div><div class="dashboard-grid"><section class="panel"><div class="row"><h3>Los últimos 7 días</h3><span class="tag">${$m(days.reduce((a,x)=>a+x.n,0))}</span></div><div class="chart">${days.map(x=>`<div class="bar-column"><small>${$m(x.n)}</small><div class="bar" style="height:${Math.max(2,x.n/max*140)}px"></div><span>${x.label}</span></div>`).join('')}</div></section><section class="panel"><span class="kick">LOS FAVORITOS</span><h3>El pan que más se comparte</h3>${Object.entries(top).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,q],i)=>`<div class="best-row"><span class="rank">0${i+1}</span><span>${esc(n)}</span><b>${q} <small>pzas</small></b></div>`).join('')||'<div class="empty">Aquí aparecerán tus productos más vendidos.<br><small>Registra tu primera venta desde caja.</small></div>'}</section></div><div class="three channel-totals">${[['Total vendido',os],['Recoger en tienda',os.filter(o=>o.type==='pickup')],['A domicilio',os.filter(o=>o.type==='delivery')],['Mostrador',os.filter(o=>o.type==='pos')]].map(([t,a])=>`<div><small>${t}</small><h2>${$m(sum(a))}</h2><small>${a.length} pedidos completados</small></div>`).join('')}</div><div class="report-heading"><h3>Pedidos recientes</h3><button class="btn ghost sm" data-t="ped">Ver todos →</button></div><div class="tw"><table><thead><tr><th>Folio</th><th>Cliente</th><th>Canal</th><th>Estado</th><th>Total</th></tr></thead><tbody>${d.orders.slice(0,6).map(o=>`<tr><td><b>${esc(o.id)}</b>${o.demo?' · Ejemplo':''}</td><td>${esc(o.name)}</td><td>${{pos:'Mostrador',pickup:'Recoger',delivery:'Domicilio'}[o.type]}</td><td><span class="tag ${o.status}">${ST[o.status]}</span></td><td>${$m(o.total)}</td></tr>`).join('')||'<tr><td colspan="5">Todavía no hay pedidos.</td></tr>'}</tbody></table></div>`}
function R(){const d=DB.get(),low=d.products.filter(p=>p.s<10).length;
 const today=new Date().toDateString(),completed=d.orders.filter(o=>o.status==='done'&&!o.demo&&new Date(o.completedAt||o.at).toDateString()===today),revenue=completed.reduce((a,o)=>a+o.total,0);
 $('#metrics').innerHTML=[['Ventas de hoy',$m(revenue),'Pedidos completados'],['Pedidos activos',d.orders.filter(act).length,'En preparación y entrega'],['Entregas en ruta',d.orders.filter(o=>o.status==='route').length,'Pedidos a domicilio'],['Existencias bajas',low,'Productos con menos de 10 piezas']].map(([a,b,c])=>`<div><small>${a}</small><b>${b}</b><small>${c}</small></div>`).join('');
 $('#tabs').innerHTML=[['ped',`Pedidos (${d.orders.filter(act).length})`],['inv','Inventario'+(low?' ⚠ '+low:'')],['sit','Sitio web'],['ven','Ventas']].map(([k,t])=>`<button class="chip ${k===tab?'on':''}" data-t="${k}">${t}</button>`).join('');
 document.body.classList.toggle('inventory-open',tab==='inv');
 if(tab==='inv'){
   Inventory.mount($('#v'),d,catalogo);
 }else{
   $('#v').innerHTML={ped,sit,ven}[tab](d);
 }}
const up=async(action,values)=>{await DB.action(action,values);R()};
document.addEventListener('click',e=>{const button=e.target.closest('button'),D=button?.dataset;if(!D)return;if(button.id==='export-sales')exportSales();
 if(D.t){tab=D.t;history.replaceState(null,'',location.pathname+location.search+(tab==='inv'?'#inventario':''));R()}if(D.fl){fl=D.fl;R()}
 if(D.ad){const o=DB.get().orders.find(o=>o.id===D.ad),finish=o.status==='ready'&&o.type==='pickup';if(!finish||confirm('¿Confirmas que el pago fue recibido y el pedido se entregó?'))up('progress',{id:D.ad,confirmPayment:finish})}
 if(D.as)up('assign',{id:D.as});
 if(D.cx&&confirm('¿Cancelar '+D.cx+'? Se regresan las piezas al inventario.'))up('cancel',{id:D.cx});
 if(D.st)up('stock',{id:D.st,delta:+D.d})});
document.addEventListener('change',async e=>{const t=e.target;try{
 if(t.dataset.pp)await up('price',{id:t.dataset.pp,value:+t.value});
 if(t.form?.id==='sf'){await up('site',{key:t.name,value:t.type==='number'?+t.value:t.value});toast('Cambios guardados en la tienda')}
 }catch(e){toast(e.message);R()}});
document.addEventListener('submit',async e=>{if(e.target.id!=='npf')return;e.preventDefault();const f=e.target,values=Object.fromEntries(new FormData(f));for(const k of ['p','s','l'])values[k]=+values[k];try{await up('product',{product:values});toast('Producto agregado')}catch(e){toast(e.message)}});
function exportSales(){const rows=[['Folio','Fecha','Canal','Cliente','Pago','Total MXN'],...DB.get().orders.filter(o=>o.status==='done'&&!o.demo).map(o=>[o.id,new Date(o.completedAt||o.at).toLocaleString('es-MX'),o.type,o.name,o.pay,o.total])],csv='\uFEFF'+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""').replace(/^[=+@-]/,"'$&")+'"').join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='el-horno-ventas.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
DB.on(R);R();

});
</script></body></html>
