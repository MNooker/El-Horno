<!doctype html><html lang="es-MX"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El Horno · Punto de venta</title><link rel="stylesheet" href="app.css"><link rel="stylesheet" href="premium.css"></head><body>
<main class="pos"><section><div class="row"><div><span class="kick">VENTA EN MOSTRADOR</span><h2>Un buen día<br>empieza aquí.</h2><p class="muted">Selecciona, cobra y sigue compartiendo.</p></div><b id="day"></b></div><input id="q" type="search" placeholder="Buscar producto" aria-label="Buscar producto"><div id="cats" class="chips"></div><div id="g" class="pgrid"></div></section>
<button class="mobile-ticket-toggle" id="ticket-toggle" aria-expanded="false" aria-controls="pos-ticket"><span>Ver ticket · <b id="mobile-count">0</b> piezas</span><strong id="mobile-total">$0.00</strong><span>↑</span></button><aside class="ticket" id="pos-ticket"><button class="ticket-close" id="ticket-close" aria-label="Cerrar ticket">×</button><div class="ticket-heading"><span class="kick">NUEVA VENTA</span><h2>Una buena elección.</h2></div><div id="l"></div><p class="row"><span>Total</span><b id="tt" style="font-size:24px"></b></p>
<label>Pago<select id="m"><option value="cash">Efectivo</option><option value="card">Tarjeta (registro manual)</option></select></label><label id="rl">Recibido<input id="rec" type="number" min="0" step="0.01"></label><p id="chg" class="muted"></p>
<button class="btn big" id="pay">Cobrar</button><button class="btn ghost" style="width:100%;margin-top:8px" id="clr">Vaciar</button></aside></main>
<script src="store.js"></script><script>
DB.ready.then(()=>{
let submitting=false,requestId=null;const newKey=()=>Array.from(crypto.getRandomValues(new Uint8Array(16)),n=>n.toString(16).padStart(2,'0')).join('');
hub('pos');let cat='Todas',q='',cart={};
const tot=()=>cartSubtotal(cart,DB.get().products);
function R(){const d=DB.get(),today=new Date().toDateString();
 $('#day').textContent='Ventas hoy: '+$m(d.orders.filter(o=>!o.demo&&o.type==='pos'&&new Date(o.at).toDateString()===today).reduce((a,o)=>a+o.total,0));
 $('#cats').innerHTML=['Todas',...CATS].map(c=>`<button class="chip ${c===cat?'on':''}" data-c="${c}">${c}</button>`).join('');
 $('#g').innerHTML=d.products.filter(p=>(cat==='Todas'||p.c===cat)&&p.n.toLowerCase().includes(q)).map(p=>`<button class="pp" data-a="${p.id}" ${p.s<1||p.l?'disabled':''}><span>${photo(p)}</span><b>${esc(p.n)}</b><small>${$m(p.p)} · ${p.l?'Solo por encargo':p.s+' disponibles'}</small></button>`).join('');
 const ids=Object.keys(cart);if(!d.products.some(p=>(cat==='Todas'||p.c===cat)&&p.n.toLowerCase().includes(q)))$('#g').innerHTML='<p class="empty">No encontramos productos con esa búsqueda.</p>';$('#l').innerHTML=ids.length?ids.map(i=>{const p=d.products.find(x=>x.id===i);return`<div class="row"><span>${esc(p.n)}<br><small>${$m(p.p*cart[i])}</small></span><span class="qty"><button class="btn ghost sm" data-l="${i}" data-d="-1" aria-label="Quitar uno">−</button><b>${cart[i]}</b><button class="btn ghost sm" data-l="${i}" data-d="1" aria-label="Agregar uno">+</button></span></div>`}).join(''):'<p class="muted">Toca un producto para agregarlo.</p>';
 $('#mobile-total').textContent=$m(tot());$('#mobile-count').textContent=Object.values(cart).reduce((a,b)=>a+b,0);$('#tt').textContent=$m(tot());$('#pay').disabled=submitting||!ids.length||document.body.classList.contains('offline');chg()}
function chg(){const c=$('#m').value==='cash';$('#rl').hidden=!c;const r=+$('#rec').value-tot();$('#chg').textContent=c&&$('#rec').value?(r>=0?'Cambio: '+$m(r):'Faltan '+$m(-r)):''}
function add(i,n){if(submitting)return;const p=DB.get().products.find(x=>x.id===i),c=(cart[i]||0)+n;if(c>p.s)return toast('Solo quedan '+p.s);if(c<=0)delete cart[i];else cart[i]=c;R()}
document.addEventListener('click',e=>{const b=e.target.closest('button'),D=b?.dataset;if(!D)return;if(D.c){cat=D.c;R()}if(D.a)add(D.a,1);if(D.l)add(D.l,+D.d)});
$('#q').oninput=e=>{q=e.target.value.toLowerCase();R()};$('#m').onchange=chg;$('#rec').oninput=chg;$('#clr').onclick=()=>{if(submitting)return;cart={};R()};
$('#pay').onclick=async()=>{if(submitting)return;submitting=true;$('#rec').disabled=true;$('#m').disabled=true;requestId??=newKey();try{$('#pay').disabled=true;if(!Object.keys(cart).length)throw Error('El ticket está vacío.');const t=tot(),cash=$('#m').value==='cash';if(cash&&+$('#rec').value<t)throw Error('El efectivo no cubre el total.');
 $('#rec').dataset.lastReceived=$('#rec').value;const id=await place({requestId,cart:{...cart},type:'pos',name:'Mostrador',phone:'',addr:'',slot:'Ahora',pay:$('#m').value,received:+$('#rec').value});const confirmed=DB.get().orders.find(o=>o.id===id),ch=cash&&confirmed?+$('#rec').value-confirmed.total:0;cart={};requestId=null;$('#rec').value='';document.body.classList.remove('ticket-open');$('#ticket-toggle').setAttribute('aria-expanded','false');R();if(confirmed)showReceipt(id,ch);else showPendingReceipt(id)}catch(x){toast(x.message)}finally{submitting=false;$('#rec').disabled=false;$('#m').disabled=false;$('#pay').disabled=!Object.keys(cart).length||document.body.classList.contains('offline')}};
function showPendingReceipt(id){const d=document.createElement('dialog');d.className='receipt';d.innerHTML=`<h2>Venta registrada</h2><p>Folio <b>${esc(id)}</b>. El cobro ya quedó registrado. No vuelvas a cobrarlo.</p><p>Reconecta para obtener el ticket y el cambio confirmado.</p><button class="btn" id="recover-receipt">Recuperar ticket</button>`;document.body.append(d);d.showModal();const received=+$('#rec').dataset.lastReceived;d.querySelector('button').onclick=async()=>{const b=d.querySelector('button');b.disabled=true;try{await DB.refresh();const o=DB.get().orders.find(o=>o.id===id);if(!o)throw Error('El ticket todavía no está disponible. Conserva el folio.');d.remove();showReceipt(id,o.pay==='cash'?received-o.total:0)}catch(e){toast(e.message)}finally{b.disabled=false}}}
function showReceipt(id,change){const o=DB.get().orders.find(o=>o.id===id),d=document.createElement('dialog');d.className='receipt';d.innerHTML=`<div class="receipt-content"><span class="kick">VENTA REGISTRADA</span><h2>Gracias por tu compra.</h2><p>${esc(id)} · ${new Date(o.at).toLocaleString('es-MX')}</p>${o.items.map(x=>`<div class="row"><span>${x.q} × ${esc(x.n)}</span><b>${$m(x.q*x.p)}</b></div>`).join('')}<p class="row"><b>Total</b><b>${$m(o.total)}</b></p><p>${o.pay==='cash'?'Efectivo · Cambio '+$m(change):'Tarjeta · Cobro registrado manualmente'}</p></div><div class="row receipt-actions"><button class="btn ghost" onclick="window.print()">Imprimir</button><button class="btn" onclick="this.closest('dialog').remove()">Nueva venta</button></div>`;document.body.append(d);d.showModal()}
const toggleTicket=open=>{document.body.classList.toggle('ticket-open',open);$('#ticket-toggle').setAttribute('aria-expanded',String(open));if(open)$('#m').focus();else $('#ticket-toggle').focus()};$('#ticket-toggle').onclick=()=>toggleTicket(!document.body.classList.contains('ticket-open'));$('#ticket-close').onclick=()=>toggleTicket(false);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.body.classList.contains('ticket-open'))toggleTicket(false)});window.addEventListener('horno:connection',()=>{$('#pay').disabled=submitting||!Object.keys(cart).length||document.body.classList.contains('offline')});DB.on(R);R();

});
</script></body></html>
